    - generic [ref=e119]:
      - paragraph [ref=e120]: Innovation Project
      - heading "Sombreamento inteligente de colmeias no semiárido nordestino" [level=2] [ref=e121]
      - paragraph [ref=e122]: Quando as árvores do apiário perdem as folhas, as caixas das abelhas ficam expostas ao sol da estiagem. Foi desse problema real, observado em Picos, que nasceu o nosso projeto de pesquisa.
      - list [ref=e123]:
        - listitem [ref=e124]:
          - generic [aria-hidden] [ref=e126]: "1"
          - generic [ref=e127]:
            - heading "O problema" [level=3] [ref=e128]
            - paragraph [ref=e129]: No semiárido nordestino, dias muito quentes e longos períodos sem chuva castigam as colmeias. Durante a estiagem, algumas árvores perdem as folhas e deixam as caixas expostas à radiação solar direta. As abelhas precisam manter a temperatura interna entre 34 °C e 35 °C para o desenvolvimento das crias, e o calor excessivo exige mais esforço de termorregulação, com movimento de asas e uso de água. Quando falta sombra e falta água, a colônia sofre.
            - blockquote [ref=e130]:
              - paragraph [ref=e131]: Como podemos complementar a sombra natural das colmeias e oferecer uma alternativa prática para enfrentar o calor e a escassez de água durante a estiagem, mantendo a segurança das abelhas e facilitando o trabalho do apicultor?
        - listitem [ref=e132]:
          - generic [aria-hidden] [ref=e134]: "2"
          - generic [ref=e135]:
            - heading "A pesquisa científica" [level=3] [ref=e136]
            - paragraph [ref=e137]: "Procuramos fontes confiáveis, como a Embrapa e universidades, para entender o que realmente acontece com as colmeias no calor. Dois estudos guiaram o projeto:"
            - list [ref=e138]:
              - listitem [ref=e139]:
                - strong [ref=e140]: Alternativas de sombreamento para apiários
                - text: "(Embrapa Meio-Norte, 2011): pesquisa realizada em Castelo do Piauí que comparou árvores, cobertura de palha, tela sombrite e exposição direta ao sol. Os resultados destacaram a importância do sombreamento adequado para o desenvolvimento das crias."
              - listitem [ref=e141]:
                - strong [ref=e142]: Internal water supply in Africanized beehives during the dry season in the Brazilian semiarid
                - text: "(2020): estudo que registrou consumo médio de 74,6 mL de água por colmeia ao dia durante a estiagem, mostrando que a água não pode ficar de fora de nenhuma solução."
        - listitem [ref=e143]:
          - generic [aria-hidden] [ref=e145]: "3"
          - generic [ref=e146]:
            - heading "O trabalho de campo" [level=3] [ref=e147]
            - paragraph [ref=e148]:
              - text: Visitamos o apiário de
              - strong [ref=e149]: Jonildo Monteiro Luz
              - text: ", em Picos, para conhecer de perto a criação de abelhas. Acompanhamos o manejo com o fumigador, usado para liberar fumaça e facilitar o trabalho com as colmeias, e conversamos sobre as dificuldades reais do apicultor na estiagem: calor e escassez de água."
        - listitem [ref=e150]:
          - generic [aria-hidden] [ref=e152]: "4"
          - generic [ref=e153]:
            - heading "Os especialistas que ouvimos" [level=3] [ref=e154]
            - paragraph [ref=e155]: "Buscamos pessoas com experiência em biologia, engenharia agronômica e apicultura para aproximar a proposta da realidade dos apiários:"
            - list [ref=e156]:
              - listitem [ref=e157]:
                - strong [ref=e158]: Jonildo Monteiro Luz
                - text: apicultor, Picos, PI. Recebeu nossa visita e confirmou a viabilidade do sombrite para amenizar a exposição das colmeias ao sol.
              - listitem [ref=e159]:
                - strong [ref=e160]: Darcet Costa Souza
                - text: engenheiro agrônomo, professor de Apicultura da UFPI. Orientou melhorias importantes, como não usar monitor elétrico no apiário.
              - listitem [ref=e161]:
                - strong [ref=e162]: Isabel Francisca da Luz Guaraná
                - text: bióloga, professora do Colégio Santa Maria, em Recife, PE. Contribuiu com conhecimentos e sugestões para o aperfeiçoamento do projeto.
              - listitem [ref=e163]:
                - strong [ref=e164]: José Carlos de Carvalho Arraes
                - text: pesquisador da Embrapa, mestre em Biodiversidade, Ambiente e Desenvolvimento, atua em ecologia vegetal. Ajudou na definição do problema.
              - listitem [ref=e165]:
                - strong [ref=e166]: Carlos Fernando Rodrigues Guaraná
                - text: acompanhou de perto o desenvolvimento do projeto, com orientações e ajustes até a solução definitiva.
              - listitem [ref=e167]:
                - strong [ref=e168]: José Breno da Cruz
                - text: trabalhou na Fundação Liberato, no Rio Grande do Sul. Dividiu experiência técnica com a equipe.
        - listitem [ref=e169]:
          - generic [aria-hidden] [ref=e171]: "5"
          - generic [ref=e172]:
            - heading "As estratégias de investigação" [level=3] [ref=e173]
            - paragraph [ref=e174]:
              - text: "Organizamos o raciocínio com ferramentas que aprendemos na FLL:"
              - strong [ref=e175]: brainstorming
              - text: para reunir ideias de todos,
              - strong [ref=e176]: análise SWOT
              - text: para mapear forças, fraquezas, oportunidades e ameaças,
              - strong [ref=e177]: benchmarking
              - text: de práticas de manejo térmico e o
              - strong [ref=e178]: Lean Canvas
              - text: para estruturar o projeto. E usamos a
              - strong [ref=e179]: técnica dos 5 porquês
              - text: "para chegar à raiz do problema:"
            - group [ref=e180]:
              - generic "+ Ver a cadeia completa dos 5 porquês" [ref=e181] [cursor=pointer]
        - listitem [ref=e182]:
          - generic [aria-hidden] [ref=e184]: "6"
          - generic [ref=e185]:
            - heading "A solução" [level=3] [ref=e186]
            - paragraph [ref=e187]:
              - text: Criamos uma
              - strong [ref=e188]: estrutura leve e modular
              - text: para complementar a sombra natural das colmeias. A cobertura usa
              - strong [ref=e189]: sombrite
              - text: como sombreamento artificial, formando um teto com
              - strong [ref=e190]: laterais inclinadas
              - text: para reduzir a incidência direta do sol, melhorar as condições térmicas e preservar a circulação de ar. Junto da cobertura, o projeto integra um sistema de água pensado para a estiagem.
            - list [ref=e191]:
              - listitem [ref=e192]:
                - strong [ref=e193]: Sombrite
                - text: cria sombra artificial e reduz a incidência direta do sol sobre as colmeias.
              - listitem [ref=e194]:
                - strong [ref=e195]: Galão de grande capacidade
                - text: reservatório que armazena água para os períodos de escassez.
              - listitem [ref=e196]:
                - strong [ref=e197]: Canos
                - text: compoem a estrutura de circulação e o direcionamento da água.
              - listitem [ref=e198]:
                - strong [ref=e199]: Bomba de água
                - text: movimenta a água pelo sistema durante os testes.
              - listitem [ref=e200]:
                - strong [ref=e201]: Pedras
                - text: pontos de apoio para as abelhas alcançarem a água com segurança, sem risco de afogamento.
              - listitem [ref=e202]:
                - strong [ref=e203]: Estrutura de suporte
                - text: sustenta o sombrite e os demais componentes com resistência e praticidade.
        - listitem [ref=e204]:
          - generic [aria-hidden] [ref=e206]: "7"
          - generic [ref=e207]:
            - heading "Protótipo, testes e próximos passos" [level=3] [ref=e208]
            - paragraph [ref=e209]:
              - text: O protótipo reúne sombrite, canos, bomba, galão e pedras. Os próximos passos são os
              - strong [ref=e210]: testes seguros
              - text: ": verificar a estabilidade do suporte, a tensão do sombrite, a área de sombra em diferentes horários, o funcionamento da bomba e a segurança do ponto de água, sempre sem expor uma colônia ativa a riscos e com orientação de um profissional de apicultura. Cada observação será registrada para comparar versões e melhorar a solução."
            - paragraph [ref=e211]: "Compartilhamos a proposta com os especialistas durante todo o desenvolvimento e apresentamos o projeto à comunidade escolar. O feedback já mudou o desenho da solução: graças às orientações, abandonamos a ideia inicial de sombra retrátil e de monitor elétrico no apiário."
