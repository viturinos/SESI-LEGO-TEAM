    - generic [ref=f6e133]:
      - paragraph [ref=f6e134]: Innovation Project
      - heading "Sombreamento inteligente de colmeias no semiárido nordestino" [level=2] [ref=f6e135]
      - paragraph [ref=f6e136]: Quando as árvores do apiário perdem as folhas, as caixas das abelhas ficam expostas ao sol da estiagem. Foi desse problema real, observado em Picos, que nasceu o nosso projeto de pesquisa.
      - list [ref=f6e137]:
        - listitem [ref=f6e138]:
          - generic [aria-hidden] [ref=f6e140]: "1"
          - generic [ref=f6e141]:
            - heading "O problema" [level=3] [ref=f6e142]
            - paragraph [ref=f6e143]: No semiárido nordestino, dias muito quentes e longos períodos sem chuva castigam as colmeias. Durante a estiagem, algumas árvores da Caatinga perdem as folhas e deixam as caixas expostas à radiação solar direta. As abelhas precisam manter a temperatura interna entre 34 °C e 35 °C para o desenvolvimento das crias, e o calor excessivo exige mais esforço de termorregulação, com movimento de asas e uso de água. Quando falta sombra e falta água, a colônia sofre.
            - blockquote [ref=f6e144]:
              - paragraph [ref=f6e145]: Como podemos complementar a sombra natural das colmeias e oferecer uma alternativa prática para enfrentar o calor e a escassez de água durante a estiagem, mantendo a segurança das abelhas e facilitando o trabalho do apicultor?
        - listitem [ref=f6e146]:
          - generic [aria-hidden] [ref=f6e148]: "2"
          - generic [ref=f6e149]:
            - 'heading "Do problema amplo ao foco: o nosso pivô" [level=3] [ref=f6e150]'
            - paragraph [ref=f6e151]:
              - text: Nosso primeiro ponto de partida foi a
              - strong [ref=f6e152]: "\"seca verde\""
              - text: ": os impactos gerais da seca na vegetação e no alimento das abelhas. Percebemos, porém, que tentar resolver um problema tão amplo era inviável para um protótipo de engenharia — e registramos no diário de bordo uma"
              - strong [ref=f6e153]: mudança estratégica de rota
              - text: .
            - paragraph [ref=f6e154]:
              - text: "Especificamos o problema para um gargalo pontual e prático: o"
              - strong [ref=f6e155]: estresse térmico das colmeias
              - text: pela falta de sombra natural quando as árvores perdem as folhas no semiárido. De um problema grande demais, chegamos a um que conseguimos atacar de verdade.
        - listitem [ref=f6e156]:
          - generic [aria-hidden] [ref=f6e158]: "3"
          - generic [ref=f6e159]:
            - heading "A pesquisa científica" [level=3] [ref=f6e160]
            - paragraph [ref=f6e161]: "Procuramos fontes confiáveis, como a Embrapa e universidades, para entender o que realmente acontece com as colmeias no calor. Dois estudos guiaram o projeto:"
            - list [ref=f6e162]:
              - listitem [ref=f6e163]:
                - strong [ref=f6e164]: Alternativas de sombreamento para apiários
                - text: "(Embrapa Meio-Norte, 2011): pesquisa realizada em Castelo do Piauí que comparou árvores, cobertura de palha, tela sombrite e exposição direta ao sol. Os resultados destacaram a importância do sombreamento adequado para o desenvolvimento das crias."
              - listitem [ref=f6e165]:
                - strong [ref=f6e166]: Internal water supply in Africanized beehives during the dry season in the Brazilian semiarid
                - text: "(2020): estudo que registrou consumo médio de 74,6 mL de água por colmeia ao dia durante a estiagem, mostrando que a água não pode ficar de fora de nenhuma solução."
        - listitem [ref=f6e167]:
          - generic [aria-hidden] [ref=f6e169]: "4"
          - generic [ref=f6e170]:
            - heading "O trabalho de campo" [level=3] [ref=f6e171]
            - paragraph [ref=f6e172]:
              - text: Visitamos o apiário de
              - strong [ref=f6e173]: Jonildo Monteiro Luz
              - text: ", em Picos, no 15/10/2026, para conhecer de perto a criação de abelhas. Acompanhamos o manejo com o fumigador, usado para liberar fumaça e facilitar o trabalho com as colmeias, e conversamos sobre as dificuldades reais do apicultor na estiagem: calor e escassez de água."
            - generic [ref=f6e174]:
              - figure "A equipe diante das colmeias no apiário de Jonildo." [ref=f6e175]:
                - link [ref=f6e176] [cursor=pointer]:
                  - /url: assets/img/temporada-dia12-apiario.webp
                  - img "Grupo da equipe posando ao ar livre no apiário, com caixas de colmeias azuis à frente e árvores ao fundo" [ref=f6e177]
              - figure "O manejo das colmeias mostrado pelo apicultor." [ref=f6e179]:
                - link [ref=f6e180] [cursor=pointer]:
                  - /url: assets/img/temporada-dia12-jonildo.webp
                  - img "Apicultor de macacão de proteção amarelo manuseando equipamento junto às colmeias durante a visita da equipe" [ref=f6e181]
        - listitem [ref=f6e183]:
          - generic [aria-hidden] [ref=f6e185]: "5"
          - generic [ref=f6e186]:
            - heading "Os especialistas que ouvimos" [level=3] [ref=f6e187]
            - paragraph [ref=f6e188]: "Buscamos pessoas com experiência em biologia, engenharia agronômica e apicultura para aproximar a proposta da realidade dos apiários:"
            - list [ref=f6e189]:
              - listitem [ref=f6e190]:
                - strong [ref=f6e191]: Jonildo Monteiro Luz
                - text: apicultor em Picos, PI. Recebeu nossa visita no apiário, confirmou a viabilidade do sombrite para amenizar o calor das colmeias e aprovou a alternativa de estrutura fixa no lugar da sombra retrátil.
              - listitem [ref=f6e192]:
                - strong [ref=f6e193]: Darcet Costa Souza
                - text: "engenheiro agrônomo e professor de Apicultura da UFPI, Campus Ministro Petrônio Portela, em Teresina, PI. Orientou as mudanças que simplificaram a solução: sem monitor elétrico no apiário e fim da sombra retrátil, em favor de uma estrutura fixa e prática."
              - listitem [ref=f6e194]:
                - strong [ref=f6e195]: Isabel Francisca da Luz Guaraná
                - text: bióloga e professora do Colégio Santa Maria, em Recife, PE. Acompanhou o desenvolvimento do projeto com conhecimentos e sugestões para o aperfeiçoamento.
              - listitem [ref=f6e196]:
                - strong [ref=f6e197]: José Carlos de Carvalho Arraes
                - text: biólogo, mestre em Biodiversidade, Ambiente e Saúde, atua em ecologia vegetal. Ajudou na definição da problemática, apresentando vantagens e desvantagens das ideias propostas.
              - listitem [ref=f6e198]:
                - strong [ref=f6e199]: Carlos Fernando Rodrigues Guaraná
                - text: professor universitário, biólogo e pesquisador da UFRPE, em Recife, PE. Mestre e doutor pela UFPE, atua há mais de 30 anos em microbiologia, controle biológico de pragas e conservação ambiental, com pesquisas e publicações científicas.
              - listitem [ref=f6e200]:
                - strong [ref=f6e201]: José Breno da Cruz
                - text: trabalhou na Fundação Liberato, no Rio Grande do Sul, e atualmente está aposentado. Dividiu experiência técnica com a equipe.
        - listitem [ref=f6e202]:
          - generic [aria-hidden] [ref=f6e204]: "6"
          - generic [ref=f6e205]:
            - heading "As estratégias de investigação" [level=3] [ref=f6e206]
            - paragraph [ref=f6e207]:
              - text: "Organizamos o raciocínio com ferramentas que aprendemos na FLL:"
              - strong [ref=f6e208]: brainstorming
              - text: para reunir ideias de todos,
              - strong [ref=f6e209]: análise SWOT
              - text: para mapear forças, fraquezas, oportunidades e ameaças,
              - strong [ref=f6e210]: benchmarking
              - text: de práticas de manejo térmico e o
              - strong [ref=f6e211]: Lean Canvas
              - text: para estruturar o projeto. E usamos a
              - strong [ref=f6e212]: técnica dos 5 porquês
              - text: "para chegar à raiz do problema:"
            - group [ref=f6e213]:
              - generic "+ Ver a cadeia completa dos 5 porquês" [ref=f6e214] [cursor=pointer]
        - listitem [ref=f6e215]:
          - generic [aria-hidden] [ref=f6e217]: "7"
          - generic [ref=f6e218]:
            - heading "A solução" [level=3] [ref=f6e219]
            - paragraph [ref=f6e220]:
              - text: Criamos uma
              - strong [ref=f6e221]: estrutura leve e modular
              - text: para complementar a sombra natural das colmeias. A cobertura usa
              - strong [ref=f6e222]: sombrite
              - text: como sombreamento artificial, formando um teto com
              - strong [ref=f6e223]: laterais inclinadas
              - text: para reduzir a incidência direta do sol, melhorar as condições térmicas e preservar a circulação de ar. Junto da cobertura, o projeto integra um sistema de água pensado para a estiagem.
            - list [ref=f6e224]:
              - listitem [ref=f6e225]:
                - strong [ref=f6e226]: Sombrite
                - text: cria sombra artificial e reduz a incidência direta do sol sobre as colmeias.
              - listitem [ref=f6e227]:
                - strong [ref=f6e228]: Galão de grande capacidade
                - text: reservatório que armazena água para os períodos de escassez.
              - listitem [ref=f6e229]:
                - strong [ref=f6e230]: Canos
                - text: compoem a estrutura de circulação e o direcionamento da água.
              - listitem [ref=f6e231]:
                - strong [ref=f6e232]: Bomba de água
                - text: movimenta a água pelo sistema durante os testes.
              - listitem [ref=f6e233]:
                - strong [ref=f6e234]: Pedras
                - text: pontos de apoio para as abelhas alcançarem a água com segurança, sem risco de afogamento.
              - listitem [ref=f6e235]:
                - strong [ref=f6e236]: Estrutura de suporte
                - text: sustenta o sombrite e os demais componentes com resistência e praticidade.
        - listitem [ref=f6e237]:
          - generic [aria-hidden] [ref=f6e239]: "8"
          - generic [ref=f6e240]:
            - heading "Protótipo, testes e próximos passos" [level=3] [ref=f6e241]
            - paragraph [ref=f6e242]:
              - text: O protótipo reúne sombrite, canos, bomba, galão e pedras. Os próximos passos são os
              - strong [ref=f6e243]: testes seguros
              - text: ": verificar a estabilidade do suporte, a tensão do sombrite, a área de sombra em diferentes horários, o funcionamento da bomba e a segurança do ponto de água, sempre sem expor uma colônia ativa a riscos e com orientação de um profissional de apicultura. Cada observação será registrada para comparar versões e melhorar a solução."
            - paragraph [ref=f6e244]: "Compartilhamos a proposta com os especialistas durante todo o desenvolvimento e apresentamos o projeto à comunidade escolar. O feedback já mudou o desenho da solução: graças às orientações, abandonamos a ideia inicial de sombra retrátil e de monitor elétrico no apiário."
            - figure "O banner oficial do nosso Projeto de Inovação, apresentado aos juízes da FLL." [ref=f6e245]:
              - link [ref=f6e246] [cursor=pointer]:
                - /url: assets/img/banner-projeto.webp
                - img "Banner oficial do Projeto de Inovação da SESI LEGO Team, com as etapas de identificação do problema, design, solução, prototipação, comunicação e iteração, com fotos de colmeias, especialistas e materiais" [ref=f6e247]
      - group [ref=f6e249]:
        - generic "+ Referências bibliográficas" [ref=f6e250] [cursor=pointer]
