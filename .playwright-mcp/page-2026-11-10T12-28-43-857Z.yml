    - generic [ref=f10e106]:
      - paragraph [ref=f10e107]: Innovation Project
      - heading "Sombreamento inteligente de colmeias no semiárido nordestino" [level=2] [ref=f10e108]
      - paragraph [ref=f10e109]: Quando as árvores do apiário perdem as folhas, as caixas das abelhas ficam expostas ao sol da estiagem. Foi desse problema real, observado em Picos, que nasceu o nosso projeto de pesquisa.
      - list [ref=f10e110]:
        - listitem [ref=f10e111]:
          - generic [aria-hidden] [ref=f10e113]: "1"
          - generic [ref=f10e114]:
            - heading "O problema" [level=3] [ref=f10e115]
            - paragraph [ref=f10e116]: No semiárido nordestino, dias muito quentes e longos períodos sem chuva castigam as colmeias. Durante a estiagem, algumas árvores perdem as folhas e deixam as caixas expostas à radiação solar direta. As abelhas precisam manter a temperatura interna entre 34 °C e 35 °C para o desenvolvimento das crias, e o calor excessivo exige mais esforço de termorregulação, com movimento de asas e uso de água. Quando falta sombra e falta água, a colônia sofre.
            - blockquote [ref=f10e117]:
              - paragraph [ref=f10e118]: Como podemos complementar a sombra natural das colmeias e oferecer uma alternativa prática para enfrentar o calor e a escassez de água durante a estiagem, mantendo a segurança das abelhas e facilitando o trabalho do apicultor?
        - listitem [ref=f10e119]:
          - generic [aria-hidden] [ref=f10e121]: "2"
          - generic [ref=f10e122]:
            - heading "A pesquisa científica" [level=3] [ref=f10e123]
            - paragraph [ref=f10e124]: "Procuramos fontes confiáveis, como a Embrapa e universidades, para entender o que realmente acontece com as colmeias no calor. Dois estudos guiaram o projeto:"
            - list [ref=f10e125]:
              - listitem [ref=f10e126]:
                - strong [ref=f10e127]: Alternativas de sombreamento para apiários
                - text: "(Embrapa Meio-Norte, 2011): pesquisa realizada em Castelo do Piauí que comparou árvores, cobertura de palha, tela sombrite e exposição direta ao sol. Os resultados destacaram a importância do sombreamento adequado para o desenvolvimento das crias."
              - listitem [ref=f10e128]:
                - strong [ref=f10e129]: Internal water supply in Africanized beehives during the dry season in the Brazilian semiarid
                - text: "(2020): estudo que registrou consumo médio de 74,6 mL de água por colmeia ao dia durante a estiagem, mostrando que a água não pode ficar de fora de nenhuma solução."
        - listitem [ref=f10e130]:
          - generic [aria-hidden] [ref=f10e132]: "3"
          - generic [ref=f10e133]:
            - heading "O trabalho de campo" [level=3] [ref=f10e134]
            - paragraph [ref=f10e135]:
              - text: Visitamos o apiário de
              - strong [ref=f10e136]: Jonildo Monteiro Luz
              - text: ", em Picos, para conhecer de perto a criação de abelhas. Acompanhamos o manejo com o fumigador, usado para liberar fumaça e facilitar o trabalho com as colmeias, e conversamos sobre as dificuldades reais do apicultor na estiagem: calor e escassez de água."
        - listitem [ref=f10e137]:
          - generic [aria-hidden] [ref=f10e139]: "4"
          - generic [ref=f10e140]:
            - heading "Os especialistas que ouvimos" [level=3] [ref=f10e141]
            - paragraph [ref=f10e142]: "Buscamos pessoas com experiência em biologia, engenharia agronômica e apicultura para aproximar a proposta da realidade dos apiários:"
            - list [ref=f10e143]:
              - listitem [ref=f10e144]:
                - strong [ref=f10e145]: Jonildo Monteiro Luz
                - text: apicultor, Picos, PI. Recebeu nossa visita e confirmou a viabilidade do sombrite para amenizar a exposição das colmeias ao sol.
              - listitem [ref=f10e146]:
                - strong [ref=f10e147]: Darcet Costa Souza
                - text: engenheiro agrônomo, professor de Apicultura da UFPI. Orientou melhorias importantes, como não usar monitor elétrico no apiário.
              - listitem [ref=f10e148]:
                - strong [ref=f10e149]: Isabel Francisca da Luz Guaraná
                - text: bióloga, professora do Colégio Santa Maria, em Recife, PE. Contribuiu com conhecimentos e sugestões para o aperfeiçoamento do projeto.
              - listitem [ref=f10e150]:
                - strong [ref=f10e151]: José Carlos de Carvalho Arraes
                - text: pesquisador da Embrapa, mestre em Biodiversidade, Ambiente e Desenvolvimento, atua em ecologia vegetal. Ajudou na definição do problema.
              - listitem [ref=f10e152]:
                - strong [ref=f10e153]: Carlos Fernando Rodrigues Guaraná
                - text: acompanhou de perto o desenvolvimento do projeto, com orientações e ajustes até a solução definitiva.
              - listitem [ref=f10e154]:
                - strong [ref=f10e155]: José Breno da Cruz
                - text: trabalhou na Fundação Liberato, no Rio Grande do Sul. Dividiu experiência técnica com a equipe.
        - listitem [ref=f10e156]:
          - generic [aria-hidden] [ref=f10e158]: "5"
          - generic [ref=f10e159]:
            - heading "As estratégias de investigação" [level=3] [ref=f10e160]
            - paragraph [ref=f10e161]:
              - text: "Organizamos o raciocínio com ferramentas que aprendemos na FLL:"
              - strong [ref=f10e162]: brainstorming
              - text: para reunir ideias de todos,
              - strong [ref=f10e163]: análise SWOT
              - text: para mapear forças, fraquezas, oportunidades e ameaças,
              - strong [ref=f10e164]: benchmarking
              - text: de práticas de manejo térmico e o
              - strong [ref=f10e165]: Lean Canvas
              - text: para estruturar o projeto. E usamos a
              - strong [ref=f10e166]: técnica dos 5 porquês
              - text: "para chegar à raiz do problema:"
            - group [ref=f10e167]:
              - generic "+ Ver a cadeia completa dos 5 porquês" [ref=f10e168] [cursor=pointer]
        - listitem [ref=f10e169]:
          - generic [aria-hidden] [ref=f10e171]: "6"
          - generic [ref=f10e172]:
            - heading "A solução" [level=3] [ref=f10e173]
            - paragraph [ref=f10e174]:
              - text: Criamos uma
              - strong [ref=f10e175]: estrutura leve e modular
              - text: para complementar a sombra natural das colmeias. A cobertura usa
              - strong [ref=f10e176]: sombrite
              - text: como sombreamento artificial, formando um teto com
              - strong [ref=f10e177]: laterais inclinadas
              - text: para reduzir a incidência direta do sol, melhorar as condições térmicas e preservar a circulação de ar. Junto da cobertura, o projeto integra um sistema de água pensado para a estiagem.
            - list [ref=f10e178]:
              - listitem [ref=f10e179]:
                - strong [ref=f10e180]: Sombrite
                - text: cria sombra artificial e reduz a incidência direta do sol sobre as colmeias.
              - listitem [ref=f10e181]:
                - strong [ref=f10e182]: Galão de grande capacidade
                - text: reservatório que armazena água para os períodos de escassez.
              - listitem [ref=f10e183]:
                - strong [ref=f10e184]: Canos
                - text: compoem a estrutura de circulação e o direcionamento da água.
              - listitem [ref=f10e185]:
                - strong [ref=f10e186]: Bomba de água
                - text: movimenta a água pelo sistema durante os testes.
              - listitem [ref=f10e187]:
                - strong [ref=f10e188]: Pedras
                - text: pontos de apoio para as abelhas alcançarem a água com segurança, sem risco de afogamento.
              - listitem [ref=f10e189]:
                - strong [ref=f10e190]: Estrutura de suporte
                - text: sustenta o sombrite e os demais componentes com resistência e praticidade.
        - listitem [ref=f10e191]:
          - generic [aria-hidden] [ref=f10e193]: "7"
          - generic [ref=f10e194]:
            - heading "Protótipo, testes e próximos passos" [level=3] [ref=f10e195]
            - paragraph [ref=f10e196]:
              - text: O protótipo reúne sombrite, canos, bomba, galão e pedras. Os próximos passos são os
              - strong [ref=f10e197]: testes seguros
              - text: ": verificar a estabilidade do suporte, a tensão do sombrite, a área de sombra em diferentes horários, o funcionamento da bomba e a segurança do ponto de água, sempre sem expor uma colônia ativa a riscos e com orientação de um profissional de apicultura. Cada observação será registrada para comparar versões e melhorar a solução."
            - paragraph [ref=f10e198]: "Compartilhamos a proposta com os especialistas durante todo o desenvolvimento e apresentamos o projeto à comunidade escolar. O feedback já mudou o desenho da solução: graças às orientações, abandonamos a ideia inicial de sombra retrátil e de monitor elétrico no apiário."
            - figure "O banner oficial do nosso Projeto de Inovação, apresentado aos juízes da FLL." [ref=f10e199]:
              - link [ref=f10e200] [cursor=pointer]:
                - /url: assets/img/banner-projeto.webp
                - img "Banner oficial do Projeto de Inovação da SESI LEGO Team, com as etapas de identificação do problema, design, solução, prototipação, comunicação e iteração, com fotos de colmeias, especialistas e materiais" [ref=f10e201]
      - group [ref=f10e203]:
        - generic "+ Referências bibliográficas" [ref=f10e204] [cursor=pointer]
    - generic [ref=f10e206]:
      - paragraph [ref=f10e207]: Robot Design
      - heading "Uma abelha de LEGO programada para acertar" [level=2] [ref=f10e208]
      - generic [ref=f10e209]:
        - generic [ref=f10e210]:
          - paragraph [ref=f10e211]:
            - text: Nosso robô foi pensado para executar as missões com
            - strong [ref=f10e212]: consistência
            - text: ": alinhar, percorrer e agir com precisão, repetidamente. O visual preto e amarelo representa a abelha, símbolo da equipe, e faz referência a Picos, a Capital do Mel."
          - paragraph [ref=f10e213]:
            - text: O processo foi marcado por montagem, testes, identificação de limitações e mudanças na estrutura, buscando sempre mais compactação, estabilidade e precisão. Construímos
            - strong [ref=f10e214]: cinco versões
            - text: até chegar ao modelo final.
