          - listitem [ref=f7e277]: "7"
          - listitem [ref=f7e278]: "10"
        - paragraph [ref=f7e279]: "Na missão 10, o objetivo é apenas não encostar. E o posicionamento das missões 13, 14 e 15 foi escolhido a dedo: a 15 aproveita a frente reta do robô, a 14 fica próxima à base por exigir mais precisão e a 13 se encaixa melhor na trajetória."
      - heading "As cinco versões do robô" [level=3] [ref=f7e280]
      - list [ref=f7e281]:
        - listitem [ref=f7e282]:
          - img "Primeiro protótipo do robô visto de cima sobre uma mesa, ainda sem as laterais, com peças azuis e brancas, hub central e uma roda grande preta" [ref=f7e284]
          - generic [ref=f7e285]:
            - heading "Primeiro protótipo" [level=4] [ref=f7e286]
            - paragraph [ref=f7e287]: A base para experimentar a estrutura e entender como as peças se comportavam nos movimentos. Nos testes, as rodas do NXT não se encaixavam nas dimensões planejadas e foram substituídas por rodas do SPIKE, deixando o conjunto mais compacto e adequado às missões.
        - listitem [ref=f7e288]:
          - img "Segundo protótipo do robô visto de lado sobre o tapete de missão, com hub branco central, peças azuis e roda preta grande" [ref=f7e290]
          - generic [ref=f7e291]:
            - heading "Segundo protótipo" [level=4] [ref=f7e292]
            - paragraph [ref=f7e293]: Estrutura organizada com os dois sensores de cor e os motores de locomoção, planejados para o alinhamento antes de cada movimento. Depois vieram os motores da garra, as laterais elevadas em preto e amarelo e o hub SPIKE para executar a programação.
        - listitem [ref=f7e294]:
          - generic [ref=f7e295]:
            - heading "Terceiro protótipo" [level=4] [ref=f7e296]
            - paragraph [ref=f7e297]: Testamos uma proposta de robô mais largo e percebemos que ficou grande demais e inadequado para as missões. Foi um aprendizado importante sobre equilibrar o tamanho e a funcionalidade, que orientou o modelo final.
        - listitem [ref=f7e298]:
          - generic [ref=f7e299]:
            - heading "Quarta versão" [level=4] [ref=f7e300]
            - paragraph [ref=f7e301]: Reiniciamos a construção usando os aprendizados anteriores. Reposicionamos o hub, trocamos as rodas novamente, desta vez pelas EV3 técnicas de borracha, que derrapam menos e deram mais estabilidade, e ajustamos a estrutura em busca de um percurso mais consistente.
        - listitem [ref=f7e302]:
          - img "Robô final segurado pelas mãos de um integrante, visto de frente, com as duas rodas pretas grandes e as luzes dos sensores acesas" [ref=f7e304]
          - generic [ref=f7e305]:
            - heading "Modelo final" [level=4] [ref=f7e306]
            - paragraph [ref=f7e307]: Estrutura preta e amarela com tração dianteira, quatro motores grandes no conjunto, dois de locomoção e dois da garra, dois sensores de cor e o hub SPIKE. A montagem equilibra espaço, estabilidade e funcionalidade para alinhar e cumprir as missões com consistência.
