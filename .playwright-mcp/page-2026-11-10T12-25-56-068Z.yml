    - generic [ref=f3e119]:
      - paragraph [ref=f3e120]: Innovation Project
      - heading "Sombreamento inteligente de colmeias no semiárido nordestino" [level=2] [ref=f3e121]
      - paragraph [ref=f3e122]: Quando as árvores do apiário perdem as folhas, as caixas das abelhas ficam expostas ao sol da estiagem. Foi desse problema real, observado em Picos, que nasceu o nosso projeto de pesquisa.
      - list [ref=f3e123]:
        - listitem [ref=f3e124]:
          - generic [aria-hidden] [ref=f3e126]: "1"
          - generic [ref=f3e127]:
            - heading "O problema" [level=3] [ref=f3e128]
            - paragraph [ref=f3e129]: No semiárido nordestino, dias muito quentes e longos períodos sem chuva castigam as colmeias. Durante a estiagem, algumas árvores perdem as folhas e deixam as caixas expostas à radiação solar direta. As abelhas precisam manter a temperatura interna entre 34 °C e 35 °C para o desenvolvimento das crias, e o calor excessivo exige mais esforço de termorregulação, com movimento de asas e uso de água. Quando falta sombra e falta água, a colônia sofre.
            - blockquote [ref=f3e130]:
              - paragraph [ref=f3e131]: Como podemos complementar a sombra natural das colmeias e oferecer uma alternativa prática para enfrentar o calor e a escassez de água durante a estiagem, mantendo a segurança das abelhas e facilitando o trabalho do apicultor?
        - listitem [ref=f3e132]:
          - generic [aria-hidden] [ref=f3e134]: "2"
          - generic [ref=f3e135]:
            - heading "A pesquisa científica" [level=3] [ref=f3e136]
            - paragraph [ref=f3e137]: "Procuramos fontes confiáveis, como a Embrapa e universidades, para entender o que realmente acontece com as colmeias no calor. Dois estudos guiaram o projeto:"
            - list [ref=f3e138]:
              - listitem [ref=f3e139]:
                - strong [ref=f3e140]: Alternativas de sombreamento para apiários
                - text: "(Embrapa Meio-Norte, 2011): pesquisa realizada em Castelo do Piauí que comparou árvores, cobertura de palha, tela sombrite e exposição direta ao sol. Os resultados destacaram a importância do sombreamento adequado para o desenvolvimento das crias."
              - listitem [ref=f3e141]:
                - strong [ref=f3e142]: Internal water supply in Africanized beehives during the dry season in the Brazilian semiarid
                - text: "(2020): estudo que registrou consumo médio de 74,6 mL de água por colmeia ao dia durante a estiagem, mostrando que a água não pode ficar de fora de nenhuma solução."
        - listitem [ref=f3e143]:
          - generic [aria-hidden] [ref=f3e145]: "3"
          - generic [ref=f3e146]:
            - heading "O trabalho de campo" [level=3] [ref=f3e147]
            - paragraph [ref=f3e148]:
              - text: Visitamos o apiário de
              - strong [ref=f3e149]: Jonildo Monteiro Luz
              - text: ", em Picos, para conhecer de perto a criação de abelhas. Acompanhamos o manejo com o fumigador, usado para liberar fumaça e facilitar o trabalho com as colmeias, e conversamos sobre as dificuldades reais do apicultor na estiagem: calor e escassez de água."
        - listitem [ref=f3e150]:
          - generic [aria-hidden] [ref=f3e152]: "4"
          - generic [ref=f3e153]:
            - heading "Os especialistas que ouvimos" [level=3] [ref=f3e154]
            - paragraph [ref=f3e155]: "Buscamos pessoas com experiência em biologia, engenharia agronômica e apicultura para aproximar a proposta da realidade dos apiários:"
            - list [ref=f3e156]:
              - listitem [ref=f3e157]:
                - strong [ref=f3e158]: Jonildo Monteiro Luz
                - text: apicultor, Picos, PI. Recebeu nossa visita e confirmou a viabilidade do sombrite para amenizar a exposição das colmeias ao sol.
              - listitem [ref=f3e159]:
                - strong [ref=f3e160]: Darcet Costa Souza
                - text: engenheiro agrônomo, professor de Apicultura da UFPI. Orientou melhorias importantes, como não usar monitor elétrico no apiário.
              - listitem [ref=f3e161]:
                - strong [ref=f3e162]: Isabel Francisca da Luz Guaraná
                - text: bióloga, professora do Colégio Santa Maria, em Recife, PE. Contribuiu com conhecimentos e sugestões para o aperfeiçoamento do projeto.
              - listitem [ref=f3e163]:
                - strong [ref=f3e164]: José Carlos de Carvalho Arraes
                - text: pesquisador da Embrapa, mestre em Biodiversidade, Ambiente e Desenvolvimento, atua em ecologia vegetal. Ajudou na definição do problema.
              - listitem [ref=f3e165]:
                - strong [ref=f3e166]: Carlos Fernando Rodrigues Guaraná
                - text: acompanhou de perto o desenvolvimento do projeto, com orientações e ajustes até a solução definitiva.
              - listitem [ref=f3e167]:
                - strong [ref=f3e168]: José Breno da Cruz
                - text: trabalhou na Fundação Liberato, no Rio Grande do Sul. Dividiu experiência técnica com a equipe.
        - listitem [ref=f3e169]:
          - generic [aria-hidden] [ref=f3e171]: "5"
          - generic [ref=f3e172]:
            - heading "As estratégias de investigação" [level=3] [ref=f3e173]
            - paragraph [ref=f3e174]:
              - text: "Organizamos o raciocínio com ferramentas que aprendemos na FLL:"
              - strong [ref=f3e175]: brainstorming
              - text: para reunir ideias de todos,
              - strong [ref=f3e176]: análise SWOT
              - text: para mapear forças, fraquezas, oportunidades e ameaças,
              - strong [ref=f3e177]: benchmarking
              - text: de práticas de manejo térmico e o
              - strong [ref=f3e178]: Lean Canvas
              - text: para estruturar o projeto. E usamos a
              - strong [ref=f3e179]: técnica dos 5 porquês
              - text: "para chegar à raiz do problema:"
            - group [ref=f3e180]:
              - generic "+ Ver a cadeia completa dos 5 porquês" [ref=f3e181] [cursor=pointer]
        - listitem [ref=f3e182]:
          - generic [aria-hidden] [ref=f3e184]: "6"
          - generic [ref=f3e185]:
            - heading "A solução" [level=3] [ref=f3e186]
            - paragraph [ref=f3e187]:
              - text: Criamos uma
              - strong [ref=f3e188]: estrutura leve e modular
              - text: para complementar a sombra natural das colmeias. A cobertura usa
              - strong [ref=f3e189]: sombrite
              - text: como sombreamento artificial, formando um teto com
              - strong [ref=f3e190]: laterais inclinadas
              - text: para reduzir a incidência direta do sol, melhorar as condições térmicas e preservar a circulação de ar. Junto da cobertura, o projeto integra um sistema de água pensado para a estiagem.
            - list [ref=f3e191]:
              - listitem [ref=f3e192]:
                - strong [ref=f3e193]: Sombrite
                - text: cria sombra artificial e reduz a incidência direta do sol sobre as colmeias.
              - listitem [ref=f3e194]:
                - strong [ref=f3e195]: Galão de grande capacidade
                - text: reservatório que armazena água para os períodos de escassez.
              - listitem [ref=f3e196]:
                - strong [ref=f3e197]: Canos
                - text: compoem a estrutura de circulação e o direcionamento da água.
              - listitem [ref=f3e198]:
                - strong [ref=f3e199]: Bomba de água
                - text: movimenta a água pelo sistema durante os testes.
              - listitem [ref=f3e200]:
                - strong [ref=f3e201]: Pedras
                - text: pontos de apoio para as abelhas alcançarem a água com segurança, sem risco de afogamento.
              - listitem [ref=f3e202]:
                - strong [ref=f3e203]: Estrutura de suporte
                - text: sustenta o sombrite e os demais componentes com resistência e praticidade.
        - listitem [ref=f3e204]:
          - generic [aria-hidden] [ref=f3e206]: "7"
          - generic [ref=f3e207]:
            - heading "Protótipo, testes e próximos passos" [level=3] [ref=f3e208]
            - paragraph [ref=f3e209]:
              - text: O protótipo reúne sombrite, canos, bomba, galão e pedras. Os próximos passos são os
              - strong [ref=f3e210]: testes seguros
              - text: ": verificar a estabilidade do suporte, a tensão do sombrite, a área de sombra em diferentes horários, o funcionamento da bomba e a segurança do ponto de água, sempre sem expor uma colônia ativa a riscos e com orientação de um profissional de apicultura. Cada observação será registrada para comparar versões e melhorar a solução."
            - paragraph [ref=f3e211]: "Compartilhamos a proposta com os especialistas durante todo o desenvolvimento e apresentamos o projeto à comunidade escolar. O feedback já mudou o desenho da solução: graças às orientações, abandonamos a ideia inicial de sombra retrátil e de monitor elétrico no apiário."
            - figure "O banner oficial do nosso Projeto de Inovação, apresentado aos juízes da FLL." [ref=f3e212]:
              - link [ref=f3e213] [cursor=pointer]:
                - /url: assets/img/banner-projeto.webp
                - img "Banner oficial do Projeto de Inovação da SESI LEGO Team, com as etapas de identificação do problema, design, solução, prototipação, comunicação e iteração, com fotos de colmeias, especialistas e materiais" [ref=f3e214]
      - group [ref=f3e216]:
        - generic "+ Referências bibliográficas" [ref=f3e217] [cursor=pointer]
    - generic [ref=f3e219]:
      - paragraph [ref=f3e220]: Robot Design
      - heading "Uma abelha de LEGO programada para acertar" [level=2] [ref=f3e221]
      - generic [ref=f3e222]:
        - generic [ref=f3e223]:
          - paragraph [ref=f3e224]:
            - text: Nosso robô foi pensado para executar as missões com
            - strong [ref=f3e225]: consistência
            - text: ": alinhar, percorrer e agir com precisão, repetidamente. O visual preto e amarelo representa a abelha, símbolo da equipe, e faz referência a Picos, a Capital do Mel."
          - paragraph [ref=f3e226]:
            - text: O processo foi marcado por montagem, testes, identificação de limitações e mudanças na estrutura, buscando sempre mais compactação, estabilidade e precisão. Construímos
            - strong [ref=f3e227]: cinco versões
            - text: até chegar ao modelo final.
