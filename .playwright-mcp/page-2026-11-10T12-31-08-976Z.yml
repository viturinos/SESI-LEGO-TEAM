      - heading "As cinco versões do robô" [level=3] [ref=f13e267]
      - list [ref=f13e268]:
        - listitem [ref=f13e269]:
          - img "Primeiro protótipo do robô visto de cima sobre uma mesa, ainda sem as laterais, com peças azuis e brancas, hub central e uma roda grande preta" [ref=f13e271]
          - generic [ref=f13e272]:
            - heading "Primeiro protótipo" [level=4] [ref=f13e273]
            - paragraph [ref=f13e274]: A base para experimentar a estrutura e entender como as peças se comportavam nos movimentos. Nos testes, as rodas do NXT não se encaixavam nas dimensões planejadas e foram substituídas por rodas do SPIKE, deixando o conjunto mais compacto e adequado às missões.
        - listitem [ref=f13e275]:
          - img "Segundo protótipo do robô visto de lado sobre o tapete de missão, com hub branco central, peças azuis e roda preta grande" [ref=f13e277]
          - generic [ref=f13e278]:
            - heading "Segundo protótipo" [level=4] [ref=f13e279]
            - paragraph [ref=f13e280]: Estrutura organizada com os dois sensores de cor e os motores de locomoção, planejados para o alinhamento antes de cada movimento. Depois vieram os motores da garra, as laterais elevadas em preto e amarelo e o hub SPIKE para executar a programação.
        - listitem [ref=f13e281]:
          - generic [ref=f13e282]:
            - heading "Terceiro protótipo" [level=4] [ref=f13e283]
            - paragraph [ref=f13e284]: Testamos uma proposta de robô mais largo e percebemos que ficou grande demais e inadequado para as missões. Foi um aprendizado importante sobre equilibrar o tamanho e a funcionalidade, que orientou o modelo final.
        - listitem [ref=f13e285]:
          - generic [ref=f13e286]:
            - heading "Quarta versão" [level=4] [ref=f13e287]
            - paragraph [ref=f13e288]: Reiniciamos a construção usando os aprendizados anteriores. Reposicionamos o hub, trocamos as rodas novamente, desta vez pelas EV3 técnicas de borracha, que derrapam menos e deram mais estabilidade, e ajustamos a estrutura em busca de um percurso mais consistente.
        - listitem [ref=f13e289]:
          - img "Robô final segurado pelas mãos de um integrante, visto de frente, com as duas rodas pretas grandes e as luzes dos sensores acesas" [ref=f13e291]
          - generic [ref=f13e292]:
            - heading "Modelo final" [level=4] [ref=f13e293]
            - paragraph [ref=f13e294]: Estrutura preta e amarela com tração dianteira, quatro motores grandes no conjunto, dois de locomoção e dois da garra, dois sensores de cor e o hub SPIKE. A montagem equilibra espaço, estabilidade e funcionalidade para alinhar e cumprir as missões com consistência.
      - 'heading "Programação: giro preciso com PID" [level=3] [ref=f13e295]'
      - generic [ref=f13e296]:
        - paragraph [ref=f13e297]:
          - text: Programamos o hub SPIKE em
          - strong [ref=f13e298]: Word Blocks
          - text: . O núcleo da programação é o
          - strong [ref=f13e299]: TURN ON
          - text: ", nosso sistema de controle de giro baseado em"
          - strong [ref=f13e300]: PID
          - text: ": ele compara o comportamento esperado com o real e corrige os desvios durante o movimento. Ao programar um giro de 90°, por exemplo, o sistema monitora a rotação e faz ajustes até atingir exatamente o ângulo desejado, reduzindo oscilações nas missões."
        - list "Termos do controle PID" [ref=f13e301]:
