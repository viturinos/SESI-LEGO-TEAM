      - paragraph [ref=f13e330]: "Os Core Values são o coração da FIRST LEGO League. Não os tratamos como uma lista: cada valor abaixo tem um exemplo real do nosso processo nesta temporada."
      - list [ref=f13e331]:
        - listitem [ref=f13e332]:
          - heading "Trabalho em equipe" [level=3] [ref=f13e333]
          - paragraph [ref=f13e334]: Montagem, programação, testes e planejamento das missões foram compartilhados, com ideias discutidas e decisões tomadas em conjunto.
