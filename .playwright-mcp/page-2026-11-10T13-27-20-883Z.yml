    - generic [ref=f9e148]:
      - paragraph [ref=f9e149]: Innovation Project
      - heading "Sombreamento inteligente de colmeias no semiárido nordestino" [level=2] [ref=f9e150]
      - paragraph [ref=f9e151]: Quando as árvores do apiário perdem as folhas, as caixas das abelhas ficam expostas ao sol da estiagem. Foi desse problema real, observado em Picos, que nasceu o nosso projeto de pesquisa.
      - list [ref=f9e152]:
        - listitem [ref=f9e153]:
          - generic [aria-hidden] [ref=f9e155]: "1"
          - generic [ref=f9e156]:
            - heading "O problema" [level=3] [ref=f9e157]
            - paragraph [ref=f9e158]: No semiárido nordestino, dias muito quentes e longos períodos sem chuva castigam as colmeias. Durante a estiagem, algumas árvores da Caatinga perdem as folhas e deixam as caixas expostas à radiação solar direta. As abelhas precisam manter a temperatura interna entre 34 °C e 35 °C para o desenvolvimento das crias, e o calor excessivo exige mais esforço de termorregulação, com movimento de asas e uso de água. Quando falta sombra e falta água, a colônia sofre.
            - blockquote [ref=f9e159]:
              - paragraph [ref=f9e160]: Como podemos complementar a sombra natural das colmeias e oferecer uma alternativa prática para enfrentar o calor e a escassez de água durante a estiagem, mantendo a segurança das abelhas e facilitando o trabalho do apicultor?
        - listitem [ref=f9e161]:
          - generic [aria-hidden] [ref=f9e163]: "2"
          - generic [ref=f9e164]:
            - 'heading "Do problema amplo ao foco: o nosso pivô" [level=3] [ref=f9e165]'
            - paragraph [ref=f9e166]:
              - text: Nosso primeiro ponto de partida foi a
              - strong [ref=f9e167]: "\"seca verde\""
              - text: ": os impactos gerais da seca na vegetação e no alimento das abelhas. Percebemos, porém, que tentar resolver um problema tão amplo era inviável para um protótipo de engenharia — e registramos no diário de bordo uma"
              - strong [ref=f9e168]: mudança estratégica de rota
              - text: .
            - paragraph [ref=f9e169]:
              - text: "Especificamos o problema para um gargalo pontual e prático: o"
              - strong [ref=f9e170]: estresse térmico das colmeias
              - text: pela falta de sombra natural quando as árvores perdem as folhas no semiárido. De um problema grande demais, chegamos a um que conseguimos atacar de verdade.
        - listitem [ref=f9e171]:
          - generic [aria-hidden] [ref=f9e173]: "3"
          - generic [ref=f9e174]:
            - heading "A pesquisa científica" [level=3] [ref=f9e175]
            - paragraph [ref=f9e176]: "Procuramos fontes confiáveis, como a Embrapa e universidades, para entender o que realmente acontece com as colmeias no calor. Dois estudos guiaram o projeto:"
            - list [ref=f9e177]:
              - listitem [ref=f9e178]:
                - strong [ref=f9e179]: Alternativas de sombreamento para apiários
                - text: "(Embrapa Meio-Norte, 2011): pesquisa realizada em Castelo do Piauí que comparou árvores, cobertura de palha, tela sombrite e exposição direta ao sol. Os resultados destacaram a importância do sombreamento adequado para o desenvolvimento das crias."
              - listitem [ref=f9e180]:
                - strong [ref=f9e181]: Internal water supply in Africanized beehives during the dry season in the Brazilian semiarid
                - text: "(2020): estudo que registrou consumo médio de 74,6 mL de água por colmeia ao dia durante a estiagem, mostrando que a água não pode ficar de fora de nenhuma solução."
        - listitem [ref=f9e182]:
          - generic [aria-hidden] [ref=f9e184]: "4"
          - generic [ref=f9e185]:
            - heading "O trabalho de campo" [level=3] [ref=f9e186]
            - paragraph [ref=f9e187]:
              - text: Visitamos o apiário de
              - strong [ref=f9e188]: Jonildo Monteiro Luz
              - text: ", em Picos, no 15/10/2026, para conhecer de perto a criação de abelhas. Acompanhamos o manejo com o fumigador, usado para liberar fumaça e facilitar o trabalho com as colmeias, e conversamos sobre as dificuldades reais do apicultor na estiagem: calor e escassez de água."
            - generic [ref=f9e189]:
              - figure "A equipe diante das colmeias no apiário de Jonildo." [ref=f9e190]:
                - link [ref=f9e191] [cursor=pointer]:
                  - /url: assets/img/temporada-dia12-apiario.webp
                  - img "Grupo da equipe posando ao ar livre no apiário, com caixas de colmeias azuis à frente e árvores ao fundo" [ref=f9e192]
              - figure "O manejo das colmeias mostrado pelo apicultor." [ref=f9e194]:
                - link [ref=f9e195] [cursor=pointer]:
                  - /url: assets/img/temporada-dia12-jonildo.webp
                  - img "Apicultor de macacão de proteção amarelo manuseando equipamento junto às colmeias durante a visita da equipe" [ref=f9e196]
        - listitem [ref=f9e198]:
          - generic [aria-hidden] [ref=f9e200]: "5"
          - generic [ref=f9e201]:
            - heading "Os especialistas que ouvimos" [level=3] [ref=f9e202]
            - paragraph [ref=f9e203]: "Buscamos pessoas com experiência em biologia, engenharia agronômica e apicultura para aproximar a proposta da realidade dos apiários:"
            - list [ref=f9e204]:
              - listitem [ref=f9e205]:
                - strong [ref=f9e206]: Jonildo Monteiro Luz
                - text: apicultor em Picos, PI. Recebeu nossa visita no apiário, confirmou a viabilidade do sombrite para amenizar o calor das colmeias e aprovou a alternativa de estrutura fixa no lugar da sombra retrátil.
              - listitem [ref=f9e207]:
                - strong [ref=f9e208]: Darcet Costa Souza
                - text: "engenheiro agrônomo e professor de Apicultura da UFPI, Campus Ministro Petrônio Portela, em Teresina, PI. Orientou as mudanças que simplificaram a solução: sem monitor elétrico no apiário e fim da sombra retrátil, em favor de uma estrutura fixa e prática."
              - listitem [ref=f9e209]:
                - strong [ref=f9e210]: Isabel Francisca da Luz Guaraná
                - text: bióloga e professora do Colégio Santa Maria, em Recife, PE. Acompanhou o desenvolvimento do projeto com conhecimentos e sugestões para o aperfeiçoamento.
              - listitem [ref=f9e211]:
                - strong [ref=f9e212]: José Carlos de Carvalho Arraes
                - text: biólogo, mestre em Biodiversidade, Ambiente e Saúde, atua em ecologia vegetal. Ajudou na definição da problemática, apresentando vantagens e desvantagens das ideias propostas.
              - listitem [ref=f9e213]:
                - strong [ref=f9e214]: Carlos Fernando Rodrigues Guaraná
                - text: professor universitário, biólogo e pesquisador da UFRPE, em Recife, PE. Mestre e doutor pela UFPE, atua há mais de 30 anos em microbiologia, controle biológico de pragas e conservação ambiental, com pesquisas e publicações científicas.
              - listitem [ref=f9e215]:
                - strong [ref=f9e216]: José Breno da Cruz
                - text: trabalhou na Fundação Liberato, no Rio Grande do Sul, e atualmente está aposentado. Dividiu experiência técnica com a equipe.
        - listitem [ref=f9e217]:
          - generic [aria-hidden] [ref=f9e219]: "6"
          - generic [ref=f9e220]:
            - heading "As estratégias de investigação" [level=3] [ref=f9e221]
            - paragraph [ref=f9e222]:
              - text: "Organizamos o raciocínio com ferramentas que aprendemos na FLL:"
              - strong [ref=f9e223]: brainstorming
              - text: para reunir ideias de todos,
              - strong [ref=f9e224]: análise SWOT
              - text: para mapear forças, fraquezas, oportunidades e ameaças,
              - strong [ref=f9e225]: benchmarking
              - text: de práticas de manejo térmico e o
              - strong [ref=f9e226]: Lean Canvas
              - text: para estruturar o projeto. E usamos a
              - strong [ref=f9e227]: técnica dos 5 porquês
              - text: "para chegar à raiz do problema:"
            - group [ref=f9e228]:
              - generic "+ Ver a cadeia completa dos 5 porquês" [ref=f9e229] [cursor=pointer]
        - listitem [ref=f9e230]:
          - generic [aria-hidden] [ref=f9e232]: "7"
          - generic [ref=f9e233]:
            - heading "A solução" [level=3] [ref=f9e234]
            - paragraph [ref=f9e235]:
              - text: Criamos uma
              - strong [ref=f9e236]: estrutura leve e modular
              - text: para complementar a sombra natural das colmeias. A cobertura usa
              - strong [ref=f9e237]: sombrite
              - text: como sombreamento artificial, formando um teto com
              - strong [ref=f9e238]: laterais inclinadas
              - text: para reduzir a incidência direta do sol, melhorar as condições térmicas e preservar a circulação de ar. Junto da cobertura, o projeto integra um sistema de água pensado para a estiagem.
            - list [ref=f9e239]:
              - listitem [ref=f9e240]:
                - strong [ref=f9e241]: Sombrite
                - text: cria sombra artificial e reduz a incidência direta do sol sobre as colmeias.
              - listitem [ref=f9e242]:
                - strong [ref=f9e243]: Galão de grande capacidade
                - text: reservatório que armazena água para os períodos de escassez.
              - listitem [ref=f9e244]:
                - strong [ref=f9e245]: Canos
                - text: compoem a estrutura de circulação e o direcionamento da água.
              - listitem [ref=f9e246]:
                - strong [ref=f9e247]: Bomba de água
                - text: movimenta a água pelo sistema durante os testes.
              - listitem [ref=f9e248]:
                - strong [ref=f9e249]: Pedras
                - text: pontos de apoio para as abelhas alcançarem a água com segurança, sem risco de afogamento.
              - listitem [ref=f9e250]:
                - strong [ref=f9e251]: Estrutura de suporte
                - text: sustenta o sombrite e os demais componentes com resistência e praticidade.
        - listitem [ref=f9e252]:
          - generic [aria-hidden] [ref=f9e254]: "8"
          - generic [ref=f9e255]:
            - heading "Protótipo, testes e próximos passos" [level=3] [ref=f9e256]
            - paragraph [ref=f9e257]:
              - text: O protótipo reúne sombrite, canos, bomba, galão e pedras. Os próximos passos são os
              - strong [ref=f9e258]: testes seguros
              - text: ": verificar a estabilidade do suporte, a tensão do sombrite, a área de sombra em diferentes horários, o funcionamento da bomba e a segurança do ponto de água, sempre sem expor uma colônia ativa a riscos e com orientação de um profissional de apicultura. Cada observação será registrada para comparar versões e melhorar a solução."
            - paragraph [ref=f9e259]: "Compartilhamos a proposta com os especialistas durante todo o desenvolvimento e apresentamos o projeto à comunidade escolar. O feedback já mudou o desenho da solução: graças às orientações, abandonamos a ideia inicial de sombra retrátil e de monitor elétrico no apiário."
            - figure "O banner oficial do nosso Projeto de Inovação, apresentado aos juízes da FLL." [ref=f9e260]:
              - link [ref=f9e261] [cursor=pointer]:
                - /url: assets/img/banner-projeto.webp
                - img "Banner oficial do Projeto de Inovação da SESI LEGO Team, com as etapas de identificação do problema, design, solução, prototipação, comunicação e iteração, com fotos de colmeias, especialistas e materiais" [ref=f9e262]
      - group [ref=f9e264]:
        - generic "+ Referências bibliográficas" [ref=f9e265] [cursor=pointer]
